# Mantiene activo el proyecto gratuito de Supabase (evita la pausa por 7 días sin uso).
# Ubicación en el repositorio:  .github/workflows/mantener-supabase.yml
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 9 * * *'     # todos los días (hora UTC)
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base
        run: |
          curl -fsS -X POST "https://qckedbtjngvvczkhagdb.supabase.co/rest/v1/rpc/turnero_info" \
            -H "apikey: sb_publishable_JcrEzljpF1hwHu7qiM00gA_Z65reNDp" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"ping"}'
