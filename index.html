$('#af').onsubmit=async e=>{e.preventDefault();if(e.target.dataset.busy)return;e.target.dataset.busy='1';const f=e.target,submit=f.querySelector('button[type=submit]'),original=submit?.textContent;if(submit){submit.disabled=true;submit.textContent='Procesando…'}const c={email:f.e.value.trim(),password:f.p.value};try{if(t=='in'){await q(sb.auth.signInWithPassword(c));const pn=pendingTaller();if(pn){try{await q(sb.rpc('crear_taller',{p_nombre:pn}));setPendingTaller('')}catch(x){if(!String(x?.message||'').includes('ya_tiene_taller'))throw x}}await start()}else{if(t=='reg')setPendingTaller(f.n.value.trim());const d=await q(sb.auth.signUp(c));if(!d.session){$('#er').textContent=t=='reg'?'Cuenta creada. Confirmá tu email y después ingresá: el nombre del taller quedó guardado.':'Cuenta creada. Confirmá tu email y después ingresá.';return}if(t=='reg'){await q(sb.rpc('crear_taller',{p_nombre:f.n.value.trim()}));setPendingTaller('')}await start()}}catch(x){}finally{e.target.dataset.busy='';if(submit){submit.disabled=false;submit.textContent=original}}}}
async function start(){const tid=await q(sb.rpc('mi_taller'));if(!tid){root.innerHTML='<div class="au"><div class="c">Tu cuenta todavía no está vinculada a un taller. Pedile al dueño que te vincule con tu email.<div class="r"><button onclick="salir()">Salir</button></div></div></div>';return}
if(await q(sb.rpc('soy_admin'))){await load();shell()}else mecView()}
async function mecView(){
  const my=await q(sb.rpc('mi_empleado'));
  const[o,r,mc,or,pg]=await Promise.all([
    q(sb.from('portal_mecanico').select('*')),
    q(sb.from('portal_repuestos').select('*')),
    q(sb.rpc('mi_caja')),
    q(sb.from('ordenes_total').select('*').eq('mecanico_id',my)),
    q(sb.from('pagos_orden').select('*'))
  ]);
  C.or=or||[]; C.pg=pg||[];
  const cbox=Array.isArray(mc)?(mc[0]||{}):mc||{};
  const pagos=C.pg||[];
  const pagoM=id=>pagos.filter(p=>p.orden_id==id).reduce((a,p)=>a+ +p.monto,0);
  const saldoM=x=>x.cobrada?0:Math.max(0,+x.total-pagoM(x.id));
  root.innerHTML=`<main style="max-width:760px;margin:auto"><div class="tb"><h2>Portal del mecánico</h2><button onclick="salir()">Salir</button></div>
${cbox.puede_cobrar?`<div class="c"><b>Mi caja</b><br>Caja asignada: <b>${esc(cbox.caja_nombre||'—')}</b><br>Permiso: <span class="bd ok">Puede cobrar</span>
${cbox.sesion_id?`<br>Estado: <span class="bd ok">Abierta</span> · Desde ${new Date(cbox.sesion_abierta).toLocaleString('es-AR')}<br><span class="mu">La caja es administrada por el jefe/administrador. Vos solo podés registrar cobros.</span>`:`<br>Estado: <span class="bd no">Cerrada</span><br><span class="mu">La caja debe ser abierta por el jefe/administrador antes de registrar cobros.</span>`}</div>
<div class="c"><b>Mis cobros</b><br><b>${M((pagos||[]).filter(p=>p.empleado_id==my).reduce((a,p)=>a+ +p.monto,0))}</b> registrados en pagos de órdenes${(pagos||[]).filter(p=>p.empleado_id==my).length?`<div class="mu" style="margin-top:6px">${(pagos||[]).filter(p=>p.empleado_id==my).slice(-10).reverse().map(p=>`${new Date(p.created_at).toLocaleString('es-AR')} · Orden · ${M(p.monto)} · ${L(p.medio)}${p.vuelto>0?' · Vuelto '+M(p.vuelto):''}`).join('<br>')}</div>`:'<div class="mu">Todavía no registraste cobros.</div>'}</div>`:
`<div class="c"><b>Caja</b><br><span class="bd no">Solo trabajar en órdenes</span><br><span class="mu">El administrador no te habilitó para cobrar o no te asignó una caja.</span></div>`}
${o.map(x=>{const saldo=saldoM(x);return`<div class="c"><b>Orden #${x.numero} · ${esc(x.marca_modelo)} ${esc(x.patente)}</b><br>${x.anio||''} · ${esc(x.motor)} · ${esc(x.datos)}<br><b>Trabajo:</b> ${esc(x.descripcion)}<br><b>Problemas:</b> ${esc(x.informe_problemas)}<br><b>Posible solución:</b> ${esc(x.posible_solucion)}<br>${r.filter(i=>i.orden_id==x.id).map(i=>`<span class="mu">· ${esc(i.descripcion)} x${i.cantidad}</span><br>`).join('')}<br>
<select onchange="mest('${x.id}',this.value)">${['orden_abierta','en_reparacion','terminada'].map(e=>`<option value="${e}" ${e==x.estado?'selected':''}>${L(e)}</option>`).join('')}</select>
${x.estado!='presupuesto'&&cbox.puede_cobrar&&cbox.sesion_id&&!x.cobrada?`<button class="s p" onclick="mecCobrar('${x.id}')">Cobrar · saldo ${M(saldo)}</button>`:''}
${x.cobrada?'<span class="bd ok">Cobrada</span>':saldo<+x.total?`<span class="bd">Pagado ${M(pagoM(x.id))} · saldo ${M(saldo)}</span>`:''}</div>`}).join('')||'<div class="c mu">No tenés órdenes asignadas.</div>'}</main>`;
}
const mecCobrar=id=>{const o=C.or.find(x=>x.id==id);const saldo=saldoOrden(id);form('Cobrar orden #'+o.numero+' · Saldo '+M(saldo),[['m','Medio de pago','sel',MED],['p','Importe entregado','number'],['d','Nº de cheque / cuenta / nota']],{p:saldo},async r=>{const z=await q(sb.rpc('registrar_pago_orden',{p_orden:id,p_medio:r.m,p_detalle:r.d,p_pagado:+r.p||0}));const x=Array.isArray(z)?z[0]:z;if(x?.vuelto>0)alert('Cobro registrado. Vuelto: '+M(x.vuelto));mecView()})};
const mest=async(id,e)=>{try{await q(sb.rpc('mecanico_cambiar_estado',{p_orden:id,p_estado:e==='orden_abierta'?'en_reparacion':e}));mecView()}catch(_){}};
async function pub(slug){const I=await q(sb.rpc('turnero_info',{p_slug:slug}));if(!I){root.innerHTML='<div class="au">Taller no encontrado.</div>';return}
document.documentElement.style.setProperty('--ac',I.color||'#e8590c');document.title=I.nombre+' · Turnos';let f=today(),h=null,em='',oc=[];const sl=slotsOf(I.apertura,I.cierre,I.duracion),ms=I.mecanicos;
const free=x=>{const t=oc.filter(o=>o.hora.slice(0,5)==x);return !ms.length?!t.length:em?!t.some(o=>o.empleado_id==em):ms.some(m=>!t.some(o=>o.empleado_id==m.id))};
const fetchOc=async()=>{oc=await q(sb.rpc('turnero_ocupados',{p_slug:slug,p_fecha:f}));draw()};
function draw(){root.innerHTML=`<div class="au"><div style="display:flex;gap:10px;align-items:center">${I.logo_url?`<img src="${I.logo_url}" width="48">`:'🔧'}<h2 style="margin:0">${esc(I.nombre)}</h2></div><p class="mu">${esc(I.descripcion)} ${esc(I.direccion)}</p><div class="c"><b>Reservá tu turno</b><label>Día<input type="date" min="${today()}" value="${f}" id="pf"></label>${ms.length>1?`<label>Profesional<select id="pm"><option value="">Cualquiera</option>${ms.map(m=>`<option value="${m.id}" ${m.id==em?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></label>`:''}<div class="sl">${sl.map(x=>`<button class="${!free(x)?'x':x==h?'on':''}" ${!free(x)?'disabled':''} data-h="${x}">${x}</button>`).join('')}</div><form id="pfm"><label>Nombre<input name="n" required></label><label>Teléfono<input name="t" type="tel" required></label><label>Vehículo (marca, modelo, patente)<input name="v"></label><label>Servicio que necesitás<textarea name="s" rows="2"></textarea></label><button class="p" style="width:100%">Confirmar turno</button></form></div></div>`;
$('#pf').onchange=e=>{f=e.target.value;h=null;fetchOc()};if($('#pm'))$('#pm').onchange=e=>{em=e.target.value;h=null;draw()};
document.querySelectorAll('.sl button:not(.x)').forEach(b=>b.onclick=()=>{h=b.dataset.h;draw()});
$('#pfm').onsubmit=async e=>{e.preventDefault();if(!h)return alert('Elegí un horario.');if(e.target.dataset.busy)return;e.target.dataset.busy='1';const x=e.target,submit=x.querySelector('button[type=submit]'),original=submit?.textContent;if(submit){submit.disabled=true;submit.textContent='Reservando…'}try{await q(sb.rpc('turnero_reservar',{p_slug:slug,p_fecha:f,p_hora:h,p_empleado:em||null,p_nombre:x.n.value,p_telefono:x.t.value,p_vehiculo:x.v.value,p_servicio:x.s.value}));const tx=`Turno confirmado en ${I.nombre}\nDía: ${f} a las ${h}\nNombre: ${x.n.value}\nServicio: ${x.s.value}`;root.innerHTML=`<div class="au"><div class="c"><h2>✔ Turno confirmado</h2><p>${f} · ${h}<br>${esc(I.nombre)}<br>${esc(I.direccion)}</p><button class="p" id="w">Enviar comprobante por WhatsApp</button></div></div>`;$('#w').onclick=()=>wa(I.whatsapp||x.t.value,tx)}catch(_){h=null;await fetchOc()}finally{if(document.body.contains(x)){x.dataset.busy='';if(submit){submit.disabled=false;submit.textContent=original}}}}}
fetchOc()}
(async()=>{const hm=location.hash.match(/^#t=(\w+)/);if(hm)return pub(hm[1]);const{data:{session}}=await sb.auth.getSession();session?start():auth()})();
</script></body></html>
